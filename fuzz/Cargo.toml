[package]
name = "database-migrator-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
database-migrator = { version = "=0.1.0", path = "..", features = ["fuzzing-harness"] }

[[bin]]
name = "sql_scanner"
path = "fuzz_targets/sql_scanner.rs"
test = false
doc = false
bench = false

[[bin]]
name = "migration_parser"
path = "fuzz_targets/migration_parser.rs"
test = false
doc = false
bench = false

[workspace]
