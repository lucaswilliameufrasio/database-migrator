name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, test, and build
    runs-on: ubuntu-latest
    steps:
      # Revalidated against the canonical upstream release on 2026-11-08:
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Build
        run: cargo build --workspace --all-features --locked

      - name: Run executable examples
        run: |
          cargo run --example sqlite_embedded_migration --locked
          cargo run --example sqlite_schema_dsl --locked

  supply-chain:
    name: Audit dependencies and generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Revalidated against the canonical upstream release on 2026-11-08:
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Install pinned dependency audit tools
        run: |
          cargo install --locked --version 0.22.2 cargo-audit
          cargo install --locked --version 0.20.2 cargo-deny
          cargo install --locked --version 0.5.9 cargo-cyclonedx

      - name: Audit locked dependencies and generate CycloneDX SBOM
        run: sh scripts/supply-chain.sh

      - name: Upload CycloneDX SBOM
        # Revalidated against the canonical upstream release on 2026-11-08:
        # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-migrator-sbom-${{ github.sha }}
          path: bom.json
          if-no-files-found: error
          retention-days: 30

  performance:
    name: Offline validation performance baseline
    needs:
      - quality
      - supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Revalidated against the canonical upstream release on 2026-11-08:
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Record runner and toolchain
        run: |
          printf 'runner_os=%s\n' "${RUNNER_OS:-unknown}"
          printf 'runner_arch=%s\n' "${RUNNER_ARCH:-unknown}"
          printf 'runner_image=%s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -srmo
          grep -m 1 '^model name' /proc/cpuinfo || true
          nproc
          free -h
          rustc --version --verbose
          cargo --version

      - name: Build optimized CLI
        run: cargo build --release --bin dbm --locked

      - name: Measure offline validation baseline (informational)
        env:
          DBM_BENCH_TMPDIR: ${{ runner.temp }}
        run: sh scripts/bench-validate.sh target/release/dbm 1000 10
