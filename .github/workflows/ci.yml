name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, test, and build
    runs-on: ubuntu-latest
    steps:
      # Revalidated against the canonical upstream release on 2026-11-08:
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Build
        run: cargo build --workspace --all-features --locked

      - name: Run executable examples
        run: |
          cargo run --example sqlite_embedded_migration --locked
          cargo run --example sqlite_schema_dsl --locked

  # SQLite suite on the other hosted operating systems. No database service:
  # server tests stay ignored unless a URL is set, and this job sets none.
  quality-platforms:
    name: Format, lint, test, and build SQLite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep repository line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      # Revalidated against the canonical upstream release on 2026-11-14:
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Build
        run: cargo build --workspace --all-features --locked

      - name: Run executable examples
        run: |
          cargo run --example sqlite_embedded_migration --locked
          cargo run --example sqlite_schema_dsl --locked

  # PostgreSQL, MySQL, and MariaDB fault matrix on macOS. Service containers
  # are Linux-only, so the script installs Homebrew servers on 127.0.0.1.
  # Each cell runs the same ignored suite against one declared line of each
  # server: the current trio, the older PostgreSQL and MariaDB lines, and the
  # newer MySQL 9.7 plus MariaDB 13.0 lines. MySQL 8.0 and MariaDB 12.3 stay
  # out because the crate rejects them. Windows stays outside this job.
  # PgBouncer and the TLS tests stay skipped.
  # actions/checkout below was rechecked on 2026-11-16 and is still v7.0.1,
  # so this matrix does not change that pin.
  server-fault-macos:
    name: Server fault matrix (${{ matrix.label }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: pg18-mysql84-maria118
            postgres_formula: postgresql@18
            postgres_prefix: "18."
            mysql_formula: mysql@8.4
            mysql_prefix: "8.4."
            mariadb_formula: mariadb@11.8
            mariadb_prefix: "11.8."
          - label: pg16-mysql84-maria1011
            postgres_formula: postgresql@16
            postgres_prefix: "16."
            mysql_formula: mysql@8.4
            mysql_prefix: "8.4."
            mariadb_formula: mariadb@10.11
            mariadb_prefix: "10.11."
          - label: pg17-mysql84-maria114
            postgres_formula: postgresql@17
            postgres_prefix: "17."
            mysql_formula: mysql@8.4
            mysql_prefix: "8.4."
            mariadb_formula: mariadb@11.4
            mariadb_prefix: "11.4."
          - label: pg18-mysql97-maria130
            postgres_formula: postgresql@18
            postgres_prefix: "18."
            mysql_formula: mysql@9.7
            mysql_prefix: "9.7."
            mariadb_formula: mariadb@13.0
            mariadb_prefix: "13.0."
    defaults:
      run:
        shell: bash
    steps:
      # Revalidated against the canonical upstream release on 2026-11-16:
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: |
          if [ -d "$HOME/.cargo/bin" ]; then
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.99.1 --profile minimal

      - name: Compile the suite before starting databases
        run: cargo test --workspace --all-features --locked --no-run

      - name: Record runner
        run: |
          printf 'runner_os=%s\n' "${RUNNER_OS:-unknown}"
          printf 'runner_arch=%s\n' "${RUNNER_ARCH:-unknown}"
          printf 'runner_image=%s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          sw_vers
          uname -srm

      - name: Run the ignored server matrix
        env:
          DBM_MACOS_POSTGRES_FORMULA: ${{ matrix.postgres_formula }}
          DBM_MACOS_POSTGRES_PREFIX: ${{ matrix.postgres_prefix }}
          DBM_MACOS_MYSQL_FORMULA: ${{ matrix.mysql_formula }}
          DBM_MACOS_MYSQL_PREFIX: ${{ matrix.mysql_prefix }}
          DBM_MACOS_MARIADB_FORMULA: ${{ matrix.mariadb_formula }}
          DBM_MACOS_MARIADB_PREFIX: ${{ matrix.mariadb_prefix }}
        run: bash scripts/ci-macos-server-matrix.sh

  supply-chain:
    name: Audit dependencies and generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Revalidated against the canonical upstream release on 2026-11-08:
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Install pinned dependency audit tools
        run: |
          cargo install --locked --version 0.22.2 cargo-audit
          cargo install --locked --version 0.20.2 cargo-deny
          cargo install --locked --version 0.5.9 cargo-cyclonedx

      - name: Audit locked dependencies and generate CycloneDX SBOM
        run: sh scripts/supply-chain.sh

      - name: Upload CycloneDX SBOM
        # Revalidated against the canonical upstream release on 2026-11-08:
        # https://github.com/actions/upload-artifact/releases/tag/v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: database-migrator-sbom-${{ github.sha }}
          path: bom.json
          if-no-files-found: error
          retention-days: 30

  performance:
    name: Offline validation performance baseline
    needs:
      - quality
      - supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Revalidated against the canonical upstream release on 2026-11-08:
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Record runner and toolchain
        run: |
          printf 'runner_os=%s\n' "${RUNNER_OS:-unknown}"
          printf 'runner_arch=%s\n' "${RUNNER_ARCH:-unknown}"
          printf 'runner_image=%s %s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          uname -srmo
          grep -m 1 '^model name' /proc/cpuinfo || true
          nproc
          free -h
          rustc --version --verbose
          cargo --version

      - name: Build optimized CLI
        run: cargo build --release --bin dbm --locked

      - name: Measure offline validation baseline (informational)
        env:
          DBM_BENCH_TMPDIR: ${{ runner.temp }}
        run: sh scripts/bench-validate.sh target/release/dbm 1000 10
